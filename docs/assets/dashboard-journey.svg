<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="title desc"><title id="title">จากไอเดียลงทุน สู่ Dashboard ของคุณ</title><desc id="desc">คุยโจทย์ด้วย plan-dashboard เลือกแบบที่ชอบ แล้วใช้ build-dashboard สร้าง เปิดลอง และปรับต่อ ภาพนี้เป็นแนวคิดไม่ใช่แอปสำเร็จรูป</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#F47920" stroke-width="1.5"/></marker></defs><g font-family="Tahoma,Arial,sans-serif"><rect x="0" y="0" width="1200" height="744" fill="#FAFAF7" stroke="#FAFAF7" stroke-width="1"/><rect x="0" y="0" width="1200" height="270" fill="#1B3C5C" stroke="#1B3C5C" stroke-width="1"/><rect x="48" y="42" width="44" height="5" fill="#F47920" stroke="#F47920" stroke-width="1"/><text x="110" y="50" fill="#FAFAF7" font-size="22" font-weight="700">EFIN DASHBOARD STARTER</text><text x="48" y="140" fill="#FAFAF7" font-size="62" font-weight="700">จากไอเดียลงทุน</text><text x="48" y="213" fill="#FAFAF7" font-size="62" font-weight="700">สู่ Dashboard ของคุณ</text><text x="48" y="249" fill="#D4DDE6" font-size="23" font-weight="400">เริ่มจากคุยกับ AI • เลือกแบบที่ชอบ • ค่อยสร้างและปรับต่อ</text><rect x="48" y="310" width="328" height="344" fill="#FAFAF7" stroke="#D4DDE6" stroke-width="1"/><rect x="48" y="310" width="328" height="5" fill="#F47920" stroke="#F47920" stroke-width="1"/><text x="72" y="363" fill="#F47920" font-size="31" font-weight="700">01</text><text x="130" y="363" fill="#1B3C5C" font-size="33" font-weight="700">คุยโจทย์</text><text x="72" y="624" fill="#1B3C5C" font-size="22" font-weight="700">plan-dashboard</text><rect x="424" y="310" width="328" height="344" fill="#FAFAF7" stroke="#D4DDE6" stroke-width="1"/><rect x="424" y="310" width="328" height="5" fill="#F47920" stroke="#F47920" stroke-width="1"/><text x="448" y="363" fill="#F47920" font-size="31" font-weight="700">02</text><text x="506" y="363" fill="#1B3C5C" font-size="33" font-weight="700">เลือกแบบ</text><text x="448" y="624" fill="#1B3C5C" font-size="22" font-weight="700">คุณเป็นคนเลือก</text><rect x="800" y="310" width="328" height="344" fill="#FAFAF7" stroke="#D4DDE6" stroke-width="1"/><rect x="800" y="310" width="328" height="5" fill="#F47920" stroke="#F47920" stroke-width="1"/><text x="824" y="363" fill="#F47920" font-size="31" font-weight="700">03</text><text x="882" y="363" fill="#1B3C5C" font-size="33" font-weight="700">สร้างและปรับ</text><text x="824" y="624" fill="#1B3C5C" font-size="22" font-weight="700">build-dashboard</text><rect x="72" y="395" width="280" height="70" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><text x="88" y="427" fill="#1B3C5C" font-size="25" font-weight="600">อยากรู้ว่าพอร์ต</text><text x="88" y="457" fill="#1B3C5C" font-size="25" font-weight="600">กระจุกตรงไหน</text><rect x="102" y="482" width="250" height="64" fill="#1B3C5C" stroke="#1B3C5C" stroke-width="1"/><text x="118" y="522" fill="#FAFAF7" font-size="25" font-weight="600">มาคุยทีละเรื่อง</text><rect x="448" y="395" width="122" height="145" fill="#FAFAF7" stroke="#5B7A98" stroke-width="1"/><rect x="448" y="395" width="122" height="22" fill="#1B3C5C" stroke="#1B3C5C" stroke-width="1"/><rect x="590" y="395" width="122" height="145" fill="#FAFAF7" stroke="#5B7A98" stroke-width="1"/><rect x="590" y="395" width="122" height="22" fill="#1B3C5C" stroke="#1B3C5C" stroke-width="1"/><text x="456" y="416" fill="#FAFAF7" font-size="18" font-weight="700">A</text><text x="598" y="416" fill="#FAFAF7" font-size="18" font-weight="700">B</text><rect x="458" y="429" width="29" height="100" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="496" y="429" width="64" height="42" fill="#FDE4D0" stroke="#FDE4D0" stroke-width="1"/><rect x="496" y="481" width="64" height="48" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="600" y="429" width="102" height="25" fill="#FDE4D0" stroke="#FDE4D0" stroke-width="1"/><rect x="600" y="464" width="46" height="65" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="656" y="464" width="46" height="65" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><text x="448" y="577" fill="#1B3C5C" font-size="22" font-weight="400">“ชอบ A ขอเรียบขึ้น”</text><rect x="824" y="395" width="280" height="150" fill="#FAFAF7" stroke="#5B7A98" stroke-width="1"/><rect x="824" y="395" width="280" height="22" fill="#1B3C5C" stroke="#1B3C5C" stroke-width="1"/><rect x="835" y="428" width="55" height="105" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="902" y="428" width="55" height="30" fill="#FDE4D0" stroke="#FDE4D0" stroke-width="1"/><rect x="967" y="428" width="55" height="30" fill="#FDE4D0" stroke="#FDE4D0" stroke-width="1"/><rect x="1032" y="428" width="55" height="30" fill="#FDE4D0" stroke="#FDE4D0" stroke-width="1"/><rect x="902" y="471" width="98" height="11" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="1010" y="471" width="77" height="11" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="902" y="495" width="98" height="11" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="1010" y="495" width="77" height="11" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="902" y="519" width="98" height="11" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><rect x="1010" y="519" width="77" height="11" fill="#D4DDE6" stroke="#D4DDE6" stroke-width="1"/><text x="824" y="577" fill="#1B3C5C" font-size="22" font-weight="400">ลองใช้ แล้วบอกให้ปรับ</text><polyline points="380,477 418,477" fill="none" stroke="#F47920" stroke-width="3" marker-end="url(#arrow)"/><polyline points="756,477 794,477" fill="none" stroke="#F47920" stroke-width="3" marker-end="url(#arrow)"/><rect x="48" y="689" width="4" height="26" fill="#F47920" stroke="#F47920" stroke-width="1"/><text x="66" y="711" fill="#1B3C5C" font-size="25" font-weight="700">คุยจนได้สิ่งที่อยากใช้จริง</text><text x="729" y="711" fill="#5B7A98" font-size="20" font-weight="400">ภาพอธิบายแนวคิด • ไม่ใช่แอปสำเร็จรูป</text></g></svg>